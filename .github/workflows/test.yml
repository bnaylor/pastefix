name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app needs the macOS 26 SDK (Xcode 26); the packages build on macOS 14+.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Package tests (PastefixCore, PastefixAppCore)
        # Serial while the first runs are diagnosed: a hang then names the test that never ends.
        run: swift test --no-parallel
        timeout-minutes: 15
        env:
          NSUnbufferedIO: "YES"
      - name: App tests (hosted by Pastefix.app)
        run: scripts/test-app.sh
